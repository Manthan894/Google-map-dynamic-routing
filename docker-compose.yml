version: '3.8'

services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
      - "${WS_PORT:-3001}:3001"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
